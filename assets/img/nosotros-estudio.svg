<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ilustración de un estudio creativo con portátil, cuaderno, café y planta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="24" fill="url(#bg)"/>
  <circle cx="600" cy="40" r="66" fill="#c7d2fe" opacity="0.4"/>
  <circle cx="40" cy="440" r="80" fill="#c7d2fe" opacity="0.3"/>

  <!-- Superficie del escritorio -->
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="512" height="270" rx="22" fill="#ffffff"/>
  </g>

  <!-- Portátil -->
  <g filter="url(#shadow)">
    <rect x="204" y="150" width="236" height="156" rx="12" fill="#312e81"/>
  </g>
  <rect x="216" y="162" width="212" height="132" rx="7" fill="#f8faff"/>
  <rect x="216" y="162" width="212" height="30" rx="7" fill="url(#indigo)"/>
  <circle cx="232" cy="177" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="246" cy="177" r="4" fill="#c7d2fe"/>
  <rect x="232" y="208" width="86" height="9" rx="4.5" fill="#6366f1"/>
  <rect x="232" y="226" width="140" height="7" rx="3.5" fill="#dbe4ff"/>
  <rect x="232" y="242" width="112" height="7" rx="3.5" fill="#dbe4ff"/>
  <rect x="232" y="262" width="62" height="18" rx="9" fill="#a5b4fc"/>
  <path d="M196 306h252l-14 22H210z" fill="#6366f1"/>
  <rect x="296" y="309" width="52" height="5" rx="2.5" fill="#c7d2fe"/>

  <!-- Cuaderno -->
  <g transform="rotate(-8 122 300)">
    <rect x="78" y="238" width="92" height="122" rx="8" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
    <rect x="88" y="252" width="60" height="7" rx="3.5" fill="#a5b4fc"/>
    <rect x="88" y="270" width="72" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="88" y="284" width="64" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="88" y="298" width="70" height="6" rx="3" fill="#e0e7ff"/>
    <rect x="78" y="238" width="10" height="122" rx="5" fill="#4f46e5"/>
  </g>

  <!-- Taza de café -->
  <g filter="url(#shadow)">
    <circle cx="486" cy="264" r="38" fill="#ffffff"/>
  </g>
  <circle cx="486" cy="264" r="27" fill="#c7d2fe"/>
  <circle cx="486" cy="264" r="20" fill="#8b7bcf"/>
  <path d="M518 254a16 16 0 0 1 0 20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- Planta -->
  <g filter="url(#shadow)">
    <path d="M108 356h56l-8 44h-40z" fill="#818cf8"/>
  </g>
  <path d="M136 356c-4-30-26-40-38-44 2 26 16 42 38 44z" fill="#4f46e5"/>
  <path d="M136 356c6-34 28-44 42-46-4 28-18 44-42 46z" fill="#6366f1"/>
  <path d="M136 356c-2-38 2-56 8-68 12 20 10 48-8 68z" fill="#a5b4fc"/>

  <!-- Notas adhesivas -->
  <g transform="rotate(12 544 366)">
    <rect x="514" y="340" width="60" height="52" rx="6" fill="#c7d2fe"/>
    <rect x="524" y="354" width="36" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="524" y="366" width="28" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Lápiz -->
  <g transform="rotate(-28 400 372)" filter="url(#shadow)">
    <rect x="390" y="338" width="18" height="68" rx="6" fill="#4f46e5"/>
    <rect x="390" y="338" width="18" height="12" rx="6" fill="#a5b4fc"/>
    <path d="M390 400l9 14 9-14z" fill="#c7d2fe"/>
  </g>

  <!-- Detalle flotante -->
  <g filter="url(#shadow)">
    <circle cx="574" cy="124" r="24" fill="#ffffff"/>
  </g>
  <path d="M574 112v24M562 124h24" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
</svg>
