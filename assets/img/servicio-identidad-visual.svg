<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Ilustración de identidad visual con paleta de colores y tipografía">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="20" fill="url(#bg)"/>
  <circle cx="30" cy="214" r="48" fill="#c7d2fe" opacity="0.4"/>

  <!-- Tarjeta de tipografía -->
  <g filter="url(#shadow)">
    <rect x="34" y="48" width="160" height="144" rx="14" fill="#ffffff"/>
  </g>
  <text x="58" y="150" font-family="Inter, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#indigo)">Aa</text>
  <rect x="58" y="166" width="72" height="7" rx="3.5" fill="#c7d2fe"/>
  <rect x="58" y="182" width="48" height="6" rx="3" fill="#e0e7ff"/>

  <!-- Muestras de color -->
  <g filter="url(#shadow)">
    <rect x="206" y="48" width="160" height="144" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="250" cy="92" r="24" fill="#4f46e5"/>
  <circle cx="302" cy="92" r="24" fill="#6366f1"/>
  <circle cx="354" cy="92" r="24" fill="#a5b4fc"/>
  <rect x="226" y="138" width="44" height="34" rx="7" fill="#312e81"/>
  <rect x="278" y="138" width="44" height="34" rx="7" fill="#818cf8"/>
  <rect x="330" y="138" width="22" height="34" rx="7" fill="#c7d2fe"/>
  <rect x="360" y="138" width="4" height="34" rx="2" fill="#e0e7ff"/>

  <!-- Lápiz flotante -->
  <g transform="rotate(35 92 52)" filter="url(#shadow)">
    <rect x="82" y="18" width="20" height="68" rx="6" fill="#312e81"/>
    <rect x="82" y="18" width="20" height="12" rx="6" fill="#818cf8"/>
    <path d="M82 80l10 16 10-16z" fill="#c7d2fe"/>
  </g>
</svg>
