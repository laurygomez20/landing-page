<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Ilustración de optimización y rendimiento con gráfico ascendente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#312e81" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="20" fill="url(#bg)"/>
  <circle cx="380" cy="220" r="52" fill="#c7d2fe" opacity="0.4"/>

  <!-- Panel del gráfico -->
  <g filter="url(#shadow)">
    <rect x="34" y="46" width="240" height="148" rx="14" fill="#ffffff"/>
  </g>
  <rect x="54" y="66" width="76" height="8" rx="4" fill="#6366f1"/>
  <rect x="54" y="84" width="52" height="6" rx="3" fill="#dbe4ff"/>
  <rect x="56" y="166" width="28" height="10" rx="5" fill="#c7d2fe"/>
  <rect x="96" y="146" width="28" height="30" rx="5" fill="#a5b4fc"/>
  <rect x="136" y="130" width="28" height="46" rx="5" fill="#818cf8"/>
  <rect x="176" y="112" width="28" height="64" rx="5" fill="#6366f1"/>
  <rect x="216" y="100" width="28" height="76" rx="5" fill="#4f46e5"/>
  <path d="M70 150l36-14 40 4 40-30 58-16" fill="none" stroke="#312e81" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Indicador de velocidad -->
  <g filter="url(#shadow)">
    <circle cx="310" cy="106" r="58" fill="#ffffff"/>
  </g>
  <path d="M266 128a52 52 0 1 1 88 0" fill="none" stroke="#e0e7ff" stroke-width="12" stroke-linecap="round"/>
  <path d="M266 128a52 52 0 0 1 78-32" fill="none" stroke="url(#indigo)" stroke-width="12" stroke-linecap="round"/>
  <path d="M310 106l26-26" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
  <circle cx="310" cy="106" r="7" fill="#4f46e5"/>
  <rect x="284" y="140" width="52" height="8" rx="4" fill="#c7d2fe"/>

  <!-- Flecha de mejora -->
  <g filter="url(#shadow)">
    <circle cx="352" cy="190" r="28" fill="#4f46e5"/>
  </g>
  <path d="M340 198l14-18 10 10 10-16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
